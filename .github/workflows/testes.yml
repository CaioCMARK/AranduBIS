name: testes

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  testes:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Testes do frontend
        run: node --test tests/web/
      - name: Testes do servidor, geometria e interface
        run: python -m pytest tests/test_servidor.py tests/test_web.py tests/test_fronteira_geometria.py tests/test_otimiza_problema.py tests/test_alivio.py tests/test_nervuras.py tests/test_perfis.py tests/test_regra.py tests/test_decolagem.py tests/test_configuracao.py -q -p no:cacheprovider
