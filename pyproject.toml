[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aranduBIS"
version = "0.5.0"
description = "AranduBIS - projeto de aeronaves SAE AeroDesign (V2)"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.11", "numba>=0.60", "matplotlib>=3.8", "imageio-ffmpeg>=0.5"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.package-data]
aranduBIS = ["web/*", "web/manuais/*.md", "web/fontes/*"]
