<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AranduBIS</title>
<link rel="stylesheet" href="/web/estilo.css">
<script src="/web/tema.js"></script>
</head>
<body>
<div class="titulo" id="titulo">AranduBIS</div>
<div class="barra" id="barra">
  <button id="b_novo" title="Aeronave vazia">Novo</button>
  <label class="botao" title="Abrir um arquivo .json de aeronave">Abrir<input type="file" id="b_abrir" accept=".json,application/json" hidden></label>
  <select id="s_exemplos" title="Aeronaves que acompanham o programa"><option value="">Exemplos…</option></select>
  <button id="b_salvar" title="Grava em dados/aeronaves">Salvar</button>
  <button id="b_baixar" title="Baixar o .json">Baixar</button>
  <span class="g1-grupo"><span class="sep"></span>
  <select id="s_inserir" title="Inserir um elemento novo"><option value="">Inserir…</option></select>
  <button id="b_remove" title="Remove o elemento selecionado">Remover</button>
  <button id="b_desfaz" title="Desfazer (Ctrl+Z)">Desfazer</button>
  <button id="b_refaz" title="Refazer (Ctrl+Y)">Refazer</button>
  <span class="sep"></span>
  <button data-vista="iso">Iso</button><button data-vista="lateral">Lateral</button>
  <button data-vista="topo">Topo</button><button data-vista="frontal">Frontal</button>
  <button data-vista="ajusta">Ajustar</button>
  <span class="sep"></span>
  <button data-modo="solido" class="on">Sólido</button><button data-modo="malha">Malha</button>
  <span class="sep"></span>
  <button data-camada="tudo" class="on">Tudo</button><button data-camada="aero">Aero</button><button data-camada="estrutura">Estrutura</button>
  </span>
  <span class="fim"></span>
  <button id="b_arquivos" title="Base, relatórios e desenhos da equipe">Arquivos</button>
  <button id="b_config" title="Escolha de polares, Ncrit, caminhos">Configurações</button>
</div>
<div class="etapas">
  <div class="at" data-etapa="1">1 Geometria</div>
  <div data-etapa="2">2 Análise</div>
  <div data-etapa="3">3 Estrutura</div>
  <div class="bloq">4 Otimizar</div>
  <div class="bloq">5 Resultados</div>
</div>
<div class="corpo" id="et1">
  <aside class="col"><h4>Elementos</h4><div id="lista"></div></aside>
  <section class="centro">
    <div class="vista"><canvas id="cv"></canvas></div>
    <div class="baixo">
      <div class="abas" id="abas"></div>
      <div class="conteudo" id="aba_conteudo"></div>
    </div>
  </section>
  <aside class="col dir"><h4 id="tit_props">Propriedades</h4><div id="props"></div></aside>
</div>
<div class="corpo" id="et2" hidden>
  <aside class="col"><h4>Análises</h4><div id="lista2"></div></aside>
  <section class="centro dois">
    <div class="veredito" id="veredito" hidden></div>
    <div class="graficos" id="graficos2"></div>
    <div class="baixo">
      <div class="abas" id="abas2"></div>
      <div class="conteudo" id="conteudo2"></div>
    </div>
  </section>
  <aside class="col dir"><h4 id="tit_par2">Parâmetros</h4><div id="par2"></div></aside>
</div>
<div class="corpo" id="et3" hidden>
  <aside class="col"><h4>Estrutura</h4><div id="lista3"></div></aside>
  <section class="centro dois">
    <div class="veredito" id="veredito3" hidden></div>
    <div class="graficos" id="graficos3"></div>
    <div class="baixo">
      <div class="abas" id="abas3"></div>
      <div class="conteudo" id="conteudo3"></div>
    </div>
  </section>
  <aside class="col dir"><h4 id="tit_par3">Cargas</h4><div id="par3"></div></aside>
</div>
<div class="rodape"><span id="r_massa">massa —</span><span id="r_cg">CG —</span><span id="r_env">envergadura —</span><span id="r_tri"></span><span class="fim" id="r_msg">Pronto</span></div>

<dialog id="dlg_arquivos">
  <div class="dlg-topo"><b>Arquivos da equipe</b><button id="arq_fechar">Fechar</button></div>
  <div class="abas" id="arq_abas"></div>
  <div id="arq_corpo"></div>
</dialog>

<dialog id="dlg_config">
  <div class="dlg-topo"><b>Configurações</b><button id="dlg_fechar">Fechar</button></div>
  <div id="cfg_aviso" class="aviso" hidden></div>
  <div id="cfg_corpo"></div>
</dialog>

<script src="/web/padroes.js"></script>
<script src="/web/vista3d.js"></script>
<script src="/web/configuracao.js"></script>
<script src="/web/arquivos.js"></script>
<script src="/web/modelos.js"></script>
<script src="/web/estrutura.js"></script>
<script src="/web/construtor.js"></script>
<script src="/web/app.js"></script>
<script src="/web/grafico.js"></script>
<script src="/web/analise.js"></script>
<script src="/web/equilibrio.js"></script>
<script src="/web/dinamica.js"></script>
<script src="/web/controle.js"></script>
<script src="/web/polares.js"></script>
<script src="/web/tracao.js"></script>
<script src="/web/pontuacao.js"></script>
<script src="/web/etapa3.js"></script>
<script src="/web/cargas.js"></script>
<script src="/web/asa.js"></script>
<script src="/web/torcao.js"></script>
<script src="/web/flambagem.js"></script>
<script src="/web/cauda.js"></script>
<script src="/web/trem.js"></script>
<script src="/web/massa.js"></script>
</body>
</html>
